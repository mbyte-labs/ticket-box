name: ticketbox
description: Keep history of all your shows and movies.
homepage: https://ticket-box.madcodestudios.ro/

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 2.1.0+5137

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  #add_2_calendar_new: ^1.0.4
  cached_network_image: ^4.0.7
  # Direct dependency only so ArtworkCache can build the app's own bounded CacheManager for browsed
  # images (and hand it to CachedNetworkImage). Importing a transitive package trips depend_on_referenced_packages.
  flutter_cache_manager: ^3.5.0
  collection: ^1.19.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_bloc: ^9.1.1
  flutter_rating_bar: ^4.0.1
  fl_chart: ^1.3.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  in_app_purchase: ^3.3.1
  # Direct dependency only so DonationService can reach InAppPurchaseAndroidPlatformAddition
  # (consumePurchase) and the billing wrappers. Importing a transitive package trips
  # depend_on_referenced_packages.
  in_app_purchase_android: ^0.5.5
  json_annotation: ^4.12.0
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  simple_icons: ^16.23.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  #showcaseview: ^1.1.5

  flutter:
    sdk: flutter
  app_links: ^7.2.2
  material_ui: ^1.11.1


dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  # Lets tests drive time instead of sleeping (e.g. the TMDB retry back-off). Already available
  # transitively via flutter_test, declared here because the tests import it directly.
  fake_async: ^1.3.3
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  # Already available transitively via shared_preferences, declared here because the preference
  # version guard test swaps in the in-memory store directly.
  shared_preferences_platform_interface: ^2.4.2
  # Already available transitively via drift, declared here because the migration test opens the
  # raw in-memory database directly.
  sqlite3: ^3.9.1

  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/logos/ticket_box/ticket_box_white.png
    - assets/images/logos/ticket_box/ticket_box_grey.png
    - assets/images/logos/ticket_box/ticket_box_pink.png
    - assets/images/logos/tmdb/tmdb_small.png
    - assets/images/logos/reddit/reddit_wide.png
    - assets/images/logos/reddit/reddit_short.png
    - assets/images/rating_hearts/heart.png
    - assets/images/rating_hearts/heart_half.png
    - assets/images/rating_hearts/heart_border.png
    - assets/images/no-photo.png
    - assets/images/email_pic.png
    - assets/images/logos/social_media/facebook.png
    - assets/images/logos/social_media/twitter.png
    - assets/images/logos/social_media/instagram.png
    - assets/images/logos/discord/discordLogoBlue.png
    - assets/images/logos/discord/discordSmallLogoBlue.png
    - assets/images/logos/just_watch/justWatch_logo_large.png


  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/urbanist/Urbanist-Black.ttf
        - asset: assets/fonts/urbanist/Urbanist-BlackItalic.ttf
        - asset: assets/fonts/urbanist/Urbanist-Bold.ttf
        - asset: assets/fonts/urbanist/Urbanist-BoldItalic.ttf
        - asset: assets/fonts/urbanist/Urbanist-ExtraBold.ttf
        - asset: assets/fonts/urbanist/Urbanist-ExtraBoldItalic.ttf
        - asset: assets/fonts/urbanist/Urbanist-ExtraLight.ttf
        - asset: assets/fonts/urbanist/Urbanist-ExtraLightItalic.ttf
        - asset: assets/fonts/urbanist/Urbanist-Italic.ttf
        - asset: assets/fonts/urbanist/Urbanist-Light.ttf
        - asset: assets/fonts/urbanist/Urbanist-LightItalic.ttf
        - asset: assets/fonts/urbanist/Urbanist-Medium.ttf
        - asset: assets/fonts/urbanist/Urbanist-MediumItalic.ttf
        - asset: assets/fonts/urbanist/Urbanist-Regular.ttf
        - asset: assets/fonts/urbanist/Urbanist-SemiBold.ttf
        - asset: assets/fonts/urbanist/Urbanist-Thin.ttf
        - asset: assets/fonts/urbanist/Urbanist-ThinItalic.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
