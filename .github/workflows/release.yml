name: Release build (Android App Bundle + APKs)

# Two ways in, both limited to people with write access. Secrets are never available to pull
# requests from forks, and this workflow has no pull_request trigger at all. See docs/RELEASE.md.
#   - Publishing a GitHub Release tagged v<pubspec version>: builds, then attaches the split APKs.
#   - Manual run from main: builds only, nothing is published.
# Either way the app bundle for Play Console is a workflow artifact, uploaded to Play by hand.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Manual runs build from main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release builds run from main only."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the release tag can be checked against main below.
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')
          [ -n "$version" ] || { echo "::error::Could not read the version from pubspec.yaml."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=${version%%+*}" >> "$GITHUB_OUTPUT"

      # The tag name comes from whoever published the release: passed through env, never
      # interpolated into the script text.
      - name: Release tag must match pubspec and sit on main
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match pubspec.yaml: expected 'v$VERSION'."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at a commit that is not on main."
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # Secrets are written only after analyze/test, and only passed through env (never
      # interpolated into the script text), so they cannot end up in the logs.
      - name: Write signing config and API keys
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TMDB_V3_KEY: ${{ secrets.TMDB_V3_KEY }}
          TMDB_V4_TOKEN: ${{ secrets.TMDB_V4_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD TMDB_V3_KEY TMDB_V4_TOKEN OMDB_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set."; exit 1; fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.ks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.ks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          jq -n '{TMDB_V3_KEY: env.TMDB_V3_KEY, TMDB_V4_TOKEN: env.TMDB_V4_TOKEN, OMDB_API_KEY: env.OMDB_API_KEY}' > secrets.json

      # No --obfuscate / --split-debug-info on purpose (see CLAUDE.md).
      - name: Build app bundle
        run: flutter build appbundle --release --dart-define-from-file=secrets.json

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --dart-define-from-file=secrets.json

      - name: Remove signing config and API keys
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.ks" android/key.properties secrets.json

      # Same archive layout as tool/build_release.sh: bundle, R8 mapping, native symbols zipped
      # with the ABI folders at the root (what Play Console takes), build-info.txt.
      - name: Collect outputs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist/bundle dist/apk
          aab=build/app/outputs/bundle/release/app-release.aab
          cp "$aab" build/app/outputs/mapping/release/mapping.txt dist/bundle/

          symbols=$(mktemp -d)
          unzip -q "$aab" 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/*' -d "$symbols"
          (cd "$symbols/BUNDLE-METADATA/com.android.tools.build.debugsymbols" && zip -qr - .) > dist/bundle/native-debug-symbols.zip

          {
            echo "version    : $VERSION"
            echo "commit     : $GITHUB_SHA"
            echo "ref        : $GITHUB_REF"
            echo "run        : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "built (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            flutter --version
          } > dist/bundle/build-info.txt

          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/apk/ticketbox-$NAME-$abi.apk"
          done
          (cd dist/apk && sha256sum -- *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ticketbox-${{ steps.version.outputs.version }}
          retention-days: 7
          if-no-files-found: error
          path: dist/bundle/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ticketbox-${{ steps.version.outputs.version }}-apk
          retention-days: 7
          if-no-files-found: error
          path: dist/apk/

  # Separate job on purpose: it holds the only write permission in this workflow and sees no
  # signing or API secrets (it is not in the `release` environment and runs no project code).
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ticketbox-${{ needs.build.outputs.version }}-apk
          path: apk

      - name: Attach APKs to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" apk/* --repo "$GITHUB_REPOSITORY" --clobber
