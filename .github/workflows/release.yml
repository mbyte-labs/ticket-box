name: Release build (Android App Bundle)

# Manual only. Secrets are never available to pull requests from forks, and this workflow
# has no pull_request trigger at all. See docs/RELEASE.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - name: Only build from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release builds run from main only."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # Secrets are written only after analyze/test, and only passed through env (never
      # interpolated into the script text), so they cannot end up in the logs.
      - name: Write signing config and API keys
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TMDB_V3_KEY: ${{ secrets.TMDB_V3_KEY }}
          TMDB_V4_TOKEN: ${{ secrets.TMDB_V4_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD TMDB_V3_KEY TMDB_V4_TOKEN OMDB_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set."; exit 1; fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.ks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.ks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          jq -n '{TMDB_V3_KEY: env.TMDB_V3_KEY, TMDB_V4_TOKEN: env.TMDB_V4_TOKEN, OMDB_API_KEY: env.OMDB_API_KEY}' > secrets.json

      - name: Build app bundle
        run: flutter build appbundle --release --dart-define-from-file=secrets.json

      - name: Remove signing config and API keys
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.ks" android/key.properties secrets.json

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ticketbox-${{ steps.version.outputs.version }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
