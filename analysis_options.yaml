# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at
  # https://dart-lang.github.io/linter/lints/index.html.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule
    # no_leading_underscores_for_local_identifiers: false
    non_constant_identifier_names: false
    sort_child_properties_last: true      # child/children always last in widget params
    prefer_const_constructors: true       # use const wherever possible (perf + hot reload)
    prefer_const_literals_to_create_immutables: true
    use_colored_box: true                 # ColoredBox instead of Container(color:...)
    use_decorated_box: true               # DecoratedBox instead of Container(decoration:...)
    sized_box_for_whitespace: true        # SizedBox instead of Container for spacing
    avoid_dynamic_calls: true             # catches untyped .someMethod() errors at analyse time
    cancel_subscriptions: true            # ensures StreamSubscriptions are cancelled
    unawaited_futures: true               # flags fire-and-forget futures (common async bug)
    always_declare_return_types: true     # no implicit dynamic returns
    prefer_single_quotes: true            # consistent string quoting (standard in Flutter)
    directives_ordering: true             # organises imports (dart:, package:, relative)
    prefer_final_fields: true             # makes fields final where mutation isn't needed

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
  errors:
    # json_serializable annotations (@JsonSerializable / @JsonKey / @JsonEnum) sit on Freezed
    # factory constructors and their params, which the analyzer flags even though the generator
    # reads them fine. Standard Freezed + json_serializable suppression.
    invalid_annotation_target: ignore

formatter:
  page_width: 140
  trailing_commas: automate

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
